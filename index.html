<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigo Secreto 🤫</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .card { background: white; max-width: 400px; width: 100%; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; box-sizing: border-box; }
        h1 { font-size: 22px; color: #2c3e50; margin-bottom: 20px; }
        button { border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; }
        .btn-revelar { background-color: #3498db; color: white; }
        .btn-revelar:hover { background-color: #2980b9; }
        .btn-ocultar { background-color: #e74c3c; color: white; margin-top: 15px; display: none; }
        .btn-ocultar:hover { background-color: #c0392b; }
        .resultado { font-size: 26px; font-weight: bold; color: #2ecc71; margin-top: 10px; display: none; background: #ebf7ee; padding: 15px; border-radius: 5px; border: 2px dashed #2ecc71; word-wrap: break-word; }
        .erro { color: #e74c3c; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="boas-vindas">Carregando... ⌛</h1>
        <button id="btn-revelar" class="btn-revelar" onclick="revelarAmigo()" style="display: none;">REVELAR MEU AMIGO SECRETO 👀</button>
        <div id="resultado-nome" class="resultado"></div>
        <button id="btn-ocultar" class="btn-ocultar" onclick="ocultarAmigo()">OCULTAR NOME 🙈</button>
        <div id="msg-erro" class="erro" style="display: none;">Link inválido ou incompleto. ❌</div>
    </div>

<script>
let amigoOcultoDaPessoa = "";

window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const deBase64 = urlParams.get('d');   // Lê o parâmetro d (participante)
    const paraBase64 = urlParams.get('k'); // Lê o parâmetro k (amigo secreto)

    if (deBase64 && paraBase64) {
        try {
            // Decodifica o Base64 tratando os caracteres especiais e acentos corretamente (UTF-8)
            const nomeParticipante = decodeURIComponent(escape(atob(deBase64)));
            amigoOcultoDaPessoa = decodeURIComponent(escape(atob(paraBase64)));
            
            if (nomeParticipante && amigoOcultoDaPessoa) {
                document.getElementById("boas-vindas").innerText = `Olá, ${nomeParticipante}! 👋`;
                document.getElementById("btn-revelar").style.display = "block";
                return;
            }
        } catch (e) { 
            console.error("Erro ao decodificar os parâmetros da URL:", e); 
        }
    }
    
    // Caso falte algum parâmetro ou a string Base64 esteja malformada
    document.getElementById("boas-vindas").style.display = "none";
    document.getElementById("msg-erro").style.display = "block";
};

function revelarAmigo() {
    if(!amigoOcultoDaPessoa) return;
    document.getElementById("resultado-nome").innerText = amigoOcultoDaPessoa;
    document.getElementById("resultado-nome").style.display = "block";
    document.getElementById("btn-revelar").style.display = "none";
    document.getElementById("btn-ocultar").style.display = "block";
}

function ocultarAmigo() {
    document.getElementById("resultado-nome").style.display = "none";
    document.getElementById("btn-ocultar").style.display = "none";
    document.getElementById("btn-revelar").style.display = "block";
}
</script>
</body>
</html>
